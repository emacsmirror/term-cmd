# Mostly auto-generated; dependencies can be edited here, but everything else should be edited in devenv.nix.

[project]
name = "project-template"
version = "0.2.4"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["boltons==26.2.0", "frozendict==2.4.7", "packaging==26.3"]

[dependency-groups]
dev = ["licensecheck==2026.0.8", "mypy==2.3.1", "pyfakefs==6.2.0", "pytest==9.1.1", "pytest-cov==7.1.0", "pytest-custom_exit_code==0.3.0", "pytest-mock==3.15.1", "pytest-subprocess==1.6.0", "types-boltons==26.1.0.20260907"]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.coverage.run]
omit = ["/nix/store/*", "tests/*"]

[tool.pytest]
addopts = ["--cov", "--cov-report=term-missing", "--strict-markers", "--suppress-no-test-exit-code"]
markers = ["slow"]
pythonpath = ["."]

[tool.ruff]
namespace-packages = [".template"]
target-version = "py314"

[tool.ruff.lint]
ignore = ["C90", "CPY", "D1", "E741", "EM", "FIX", "PLR09", "PT011", "PTH", "PYI025", "S603", "S607", "T20", "TD", "TRY003", "TRY301", "INP001"]
select = ["ALL"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.rules]
all = "error"

[tool.uv]
exclude-newer = "7 days"
package = false
